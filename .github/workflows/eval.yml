name: Eval

# Score a real model in the real window (scripts/eval.mjs). Manual, because it
# spends model tokens. Needs the EVAL_API_KEY secret; the model and provider
# are inputs.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "anthropic, openai or compatible"
        required: true
        default: anthropic
      model:
        description: "Model id"
        required: true
      base_url:
        description: "Base URL (compatible endpoints only)"
        required: false
      thinking:
        description: "off, low, medium or high"
        required: false
        default: "off"
      runs:
        description: "Runs per scenario"
        required: false
        default: "1"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: xvfb-run -a node scripts/eval.mjs --runs ${{ inputs.runs }}
        env:
          EVAL_PROVIDER: ${{ inputs.provider }}
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_BASE_URL: ${{ inputs.base_url }}
          EVAL_THINKING: ${{ inputs.thinking }}
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: .amp/in/artifacts/eval-*
