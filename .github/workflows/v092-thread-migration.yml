name: v0.92 final source migration

on:
  push:
    branches:
      - chatgpt/v0.92-agent-os-rebuild
    paths:
      - scripts/v092_migrate_thread.py
      - .github/workflows/v092-thread-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.92-agent-os-rebuild
      - name: Apply asserted cleanup
        run: python scripts/v092_migrate_thread.py
      - name: Verify only intended sources changed
        run: |
          changed="$(git status --short)"
          echo "$changed"
          test "$(git status --short | wc -l)" -eq 4
          echo "$changed" | grep 'frontend/src/components/ThreadCardsImplementation.tsx'
          echo "$changed" | grep 'frontend/src/components/ThreadCards.tsx'
          echo "$changed" | grep 'frontend/src/workspace-overhaul.css'
          echo "$changed" | grep 'frontend/src/run-workspace.css'
      - name: Commit final source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/components/ThreadCardsImplementation.tsx \
            frontend/src/components/ThreadCards.tsx \
            frontend/src/workspace-overhaul.css \
            frontend/src/run-workspace.css
          git commit -m "refactor(workbench): remove final legacy surface paths"
          git push origin HEAD:chatgpt/v0.92-agent-os-rebuild
