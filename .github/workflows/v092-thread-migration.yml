name: v0.92 Thread migration

on:
  push:
    branches:
      - chatgpt/v0.92-agent-os-rebuild
    paths:
      - scripts/v092_migrate_thread.py
      - .github/workflows/v092-thread-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.92-agent-os-rebuild
      - name: Apply asserted migration
        run: python scripts/v092_migrate_thread.py
      - name: Verify only the intended implementation changed
        run: |
          changed="$(git status --short)"
          echo "$changed"
          test "$(git status --short | wc -l)" -eq 1
          echo "$changed" | grep 'frontend/src/components/ThreadImplementation.tsx'
      - name: Commit decomposed Thread
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/ThreadImplementation.tsx
          git commit -m "refactor(thread): remove legacy workspace ownership"
          git push origin HEAD:chatgpt/v0.92-agent-os-rebuild
