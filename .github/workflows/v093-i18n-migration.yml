name: v0.93 i18n migration

on:
  push:
    branches:
      - chatgpt/v0.93-agent-native-rebuild

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[i18n-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.93-agent-native-rebuild
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rewrite Agent-native i18n
        run: python scripts/v093_migrate_i18n.py
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/i18n.tsx; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/i18n.tsx
          git commit -m "refactor(agent): purge chat-era i18n [i18n-migrated]"
          git push origin HEAD:chatgpt/v0.93-agent-native-rebuild
