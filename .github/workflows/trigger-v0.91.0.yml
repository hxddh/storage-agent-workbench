name: Trigger v0.91.0 release

on:
  push:
    branches:
      - chore/v0.91.0-release-trigger

permissions:
  contents: write
  actions: write

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare v0.91.0 changelog on main
        env:
          NOTES_B64: ""
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path("CHANGELOG.md")
          text = path.read_text()
          heading = "## [0.91.0] - 2026-08-29"
          if heading not in text:
              notes = base64.b64decode(os.environ["NOTES_B64"]).decode()
              marker = "## [Unreleased]\n\n"
              if marker not in text:
                  raise SystemExit("CHANGELOG.md is missing the Unreleased marker")
              path.write_text(text.replace(marker, marker + notes, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): prepare v0.91.0"
            git push origin HEAD:main
          fi
          git rev-parse HEAD > /tmp/release-ref

      - name: Dispatch canonical release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REF="$(cat /tmp/release-ref)"
          gh workflow run release.yml --repo hxddh/storage-agent-workbench --ref main -f version=v0.91.0 -f ref="$REF" -f prerelease=false -f draft=false
          echo "Dispatched v0.91.0 from $REF"
