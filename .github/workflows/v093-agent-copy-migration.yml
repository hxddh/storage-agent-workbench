name: v0.93 Agent copy migration

on:
  push:
    branches:
      - chatgpt/v0.93-agent-native-rebuild

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.93-agent-native-rebuild
          fetch-depth: 0
      - name: Replace Workbench copy boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('frontend/src')
          for path in root.rglob('*'):
              if path.suffix not in {'.ts', '.tsx'}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('from "./copy"', 'from "./agentCopy"')
              updated = updated.replace('useWorkbenchCopy', 'useAgentCopy')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY
          git rm frontend/src/agent/copy.ts
          git rm .github/workflows/v093-agent-copy-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src
          git commit -m "refactor(agent): remove final Workbench copy boundary [agent-copy]"
          git push origin HEAD:chatgpt/v0.93-agent-native-rebuild
