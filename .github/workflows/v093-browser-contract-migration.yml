name: v0.93 Browser contract migration

on:
  push:
    branches:
      - chatgpt/v0.93-agent-native-rebuild

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.93-agent-native-rebuild
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace legacy browser and CSS contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          e2e = Path('frontend/e2e')
          replacements = [
              ('.getByPlaceholder(/Ask Storage Agent/i)', '.getByTestId("agent-composer").getByRole("textbox")'),
              ('/new investigation/i', '/^New task$/i'),
              ('/New investigation/i', '/^New task$/i'),
              ('.thread-item', '.task-item'),
              ('thread-scroll', 'task-scroll'),
              ('session-rail', 'agent-task-navigation'),
              ('longthread.spec.ts', 'long-task.spec.ts'),
          ]
          for path in e2e.glob('*.ts'):
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              # The old Inspector-absence assertions are redundant with the
              # production architecture guard and incorrectly keep a deleted UI
              # contract alive in browser tests.
              updated = '\n'.join(
                  line for line in updated.split('\n')
                  if 'getByTestId("session-inspector")' not in line
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          agent = Path('frontend/src/agent')
          for path in agent.rglob('*'):
              if path.suffix not in {'.ts', '.tsx', '.css'}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('workbench-', 'agent-').replace('workbench_', 'agent_')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          metrics_test = Path('frontend/src/components/TurnMetrics.test.tsx')
          text = metrics_test.read_text(encoding='utf-8')
          text = text.replace("only 1 of this turn's 3 model calls", "only 1 of this execution's 3 model calls")
          metrics_test.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/v093-browser-contract-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git commit -m "refactor(agent): purge legacy browser contracts [browser-contracts]"
          git push origin HEAD:chatgpt/v0.93-agent-native-rebuild
