name: v0.93 Agent module migration

on:
  push:
    branches:
      - chatgpt/v0.93-agent-native-rebuild

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.93-agent-native-rebuild
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Move the core UI from Workbench to Agent ownership
        shell: bash
        run: |
          git mv frontend/src/workbench frontend/src/agent
          if [ -f frontend/src/agent/WorkbenchShell.tsx ]; then git mv frontend/src/agent/WorkbenchShell.tsx frontend/src/agent/AgentShell.tsx; fi
          if [ -f frontend/src/agent/useWorkbenchProjection.ts ]; then git mv frontend/src/agent/useWorkbenchProjection.ts frontend/src/agent/useAgentTaskProjection.ts; fi
          if [ -f frontend/src/agent/workbench.test.tsx ]; then git mv frontend/src/agent/workbench.test.tsx frontend/src/agent/agentShell.test.tsx; fi
          if [ -f frontend/src/agent/workbench.css ]; then git mv frontend/src/agent/workbench.css frontend/src/agent/agent-shell.css; fi

          python - <<'PY'
          from pathlib import Path

          roots = [Path('frontend/src'), Path('frontend/e2e')]
          replacements = [
              ('./workbench/', './agent/'),
              ('../workbench/', '../agent/'),
              ('/workbench/', '/agent/'),
              ('WorkbenchShell', 'AgentShell'),
              ('useWorkbenchProjection', 'useAgentTaskProjection'),
              ('workbench-shell', 'agent-shell'),
              ('workbench-commandbar', 'agent-task-header'),
              ('workbench.css', 'agent-shell.css'),
          ]
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.suffix not in {'.ts', '.tsx', '.css'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  updated = text
                  for old, new in replacements:
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')
          PY

          git rm .github/workflows/v093-agent-module-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src frontend/e2e
          git commit -m "refactor(agent): make Agent the core UI module [agent-module]"
          git push origin HEAD:chatgpt/v0.93-agent-native-rebuild
