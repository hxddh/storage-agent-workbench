name: Release

# Transactional desktop publisher. A release can be started manually or by
# pushing a release/vX.Y.Z branch. The release stays hidden until every required
# platform artifact and checksum has uploaded successfully. Bundles are
# unsigned/ad-hoc; see docs/signing.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version / tag name (e.g. v0.93.0)"
        required: true
        default: "v0.93.0"
      ref:
        description: "Git ref (branch, tag, or SHA) to build from"
        required: true
        default: "main"
      prerelease:
        description: "Mark the release as a prerelease"
        required: true
        default: "false"
      draft:
        description: "Keep the release as a draft after all assets upload"
        required: true
        default: "false"
  push:
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      target_ref: ${{ steps.meta.outputs.target_ref }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      - name: Resolve immutable release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#release/}"
            TARGET_REF="$GITHUB_SHA"
            PRERELEASE="false"
            DRAFT="false"
          else
            VERSION="${{ github.event.inputs.version }}"
            TARGET_REF="${{ github.event.inputs.ref }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
            DRAFT="${{ github.event.inputs.draft }}"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like v0.93.0" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target_ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "Resolved $VERSION at immutable ref $TARGET_REF"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.target_ref }}

      - name: Create hidden release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET_REF: ${{ steps.meta.outputs.target_ref }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          VER_NO_V="${VERSION#v}"
          NOTES_FILE="docs/releases/$VER_NO_V.md"

          if [ -s "$NOTES_FILE" ]; then
            CHANGES="$(cat "$NOTES_FILE")"
            echo "Using versioned release notes: $NOTES_FILE"
          else
            CHANGES="$(awk -v v="## [$VER_NO_V]" '
              /^## \[/ { if (found) exit; if (index($0, v) == 1) { found=1; next } }
              found { print }
            ' CHANGELOG.md)"
          fi

          if [ -z "$(printf '%s' "$CHANGES" | tr -d '[:space:]')" ]; then
            echo "::error::No release notes found in $NOTES_FILE or CHANGELOG.md section '## [$VER_NO_V]'." >&2
            exit 1
          fi

          FLAGS="--draft"
          if [ "$PRERELEASE" = "true" ]; then FLAGS="$FLAGS --prerelease"; fi

          INSTALL="### Install

          Builds are **unsigned / ad-hoc** (no Apple notarization, no Windows Authenticode). Verify downloads against the \`SHA256SUMS-*.txt\` files.

          - **macOS (arm64):** open the .dmg and drag to Applications. On first launch, right-click the app → **Open**, or run \`xattr -dr com.apple.quarantine \"/Applications/Storage Agent Workbench.app\"\`.
          - **Linux (x64):** \`sudo apt install ./storage-agent-workbench-$VERSION-linux-x64.deb\`
          - **Windows (x64):** run the \`-setup.exe\`; if SmartScreen warns, choose **More info → Run anyway**.

          Prompt-free signed builds: see [docs/signing.md](docs/signing.md)."

          NOTES="## What's changed
          $CHANGES

          $INSTALL"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; reusing hidden release."
          else
            # gh creates the tag when it does not exist; TARGET_REF is the exact
            # tested main commit for release-branch-triggered publishing.
            gh release create "$VERSION" --target "$TARGET_REF" --title "$VERSION" --notes "$NOTES" $FLAGS
          fi

  release-macos-arm64:
    name: Release macOS arm64 (ad-hoc)
    needs: prepare
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.target_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Stamp bundle version from release metadata
        run: python3 scripts/stamp-version.py "${{ needs.prepare.outputs.version }}"
      - name: Install sidecar deps
        run: pip install -c sidecar/requirements.lock -e "./sidecar[dev]" -e "./sidecar[packaging]"
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"
      - name: Build ad-hoc-sealed macOS bundle (.app + DMG)
        run: bash scripts/build-macos-app-bundle.sh
      - name: Collect + upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          OUT="release-assets"; rm -rf "$OUT"; mkdir -p "$OUT"
          APP="$(ls -d src-tauri/target/release/bundle/macos/*.app 2>/dev/null | head -1 || true)"
          [ -n "$APP" ] || { echo "ERROR: no .app produced"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT/storage-agent-workbench-$VERSION-macos-arm64.app.zip"
          DMG="$(ls src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null | head -1 || true)"
          [ -n "$DMG" ] && cp "$DMG" "$OUT/storage-agent-workbench-$VERSION-macos-arm64.dmg" || echo "no DMG; shipping .app.zip"
          ( cd "$OUT" && shasum -a 256 storage-agent-workbench-* > SHA256SUMS-macos-arm64.txt && cat SHA256SUMS-macos-arm64.txt )
          gh release upload "$VERSION" "$OUT"/* --clobber

  release-linux-x64:
    name: Release Linux x64 (.deb)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.target_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev build-essential curl wget file libssl-dev
      - name: Stamp bundle version from release metadata
        run: python3 scripts/stamp-version.py "${{ needs.prepare.outputs.version }}"
      - name: Install sidecar deps
        run: pip install -c sidecar/requirements.lock -e "./sidecar[dev]" -e "./sidecar[packaging]"
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      - name: Build sidecar one-dir + stage resource
        run: python3 scripts/build-sidecar-for-tauri.py
      - name: Build .deb
        run: cd src-tauri && cargo tauri build --bundles deb
      - name: Collect + upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          OUT="release-assets"; rm -rf "$OUT"; mkdir -p "$OUT"
          DEB="$(ls src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | head -1 || true)"
          [ -n "$DEB" ] || { echo "ERROR: no .deb produced"; exit 1; }
          cp "$DEB" "$OUT/storage-agent-workbench-$VERSION-linux-x64.deb"
          ( cd "$OUT" && sha256sum storage-agent-workbench-* > SHA256SUMS-linux-x64.txt && cat SHA256SUMS-linux-x64.txt )
          gh release upload "$VERSION" "$OUT"/* --clobber

  release-windows-x64:
    name: Release Windows x64 (NSIS)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.target_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Stamp bundle version from release metadata
        shell: bash
        run: python scripts/stamp-version.py "${{ needs.prepare.outputs.version }}"
      - name: Install sidecar deps
        run: pip install -c sidecar/requirements.lock -e "./sidecar[dev]" -e "./sidecar[packaging]"
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"
      - name: Build frontend
        run: cd frontend; npm ci; npm run build
      - name: Build sidecar one-dir + stage resource
        run: python scripts/build-sidecar-for-tauri.py
      - name: Build NSIS installer
        run: cd src-tauri; cargo tauri build --bundles nsis
      - name: Collect + upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          OUT="release-assets"; rm -rf "$OUT"; mkdir -p "$OUT"
          EXE="$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1 || true)"
          [ -n "$EXE" ] || { echo "ERROR: no NSIS .exe produced"; exit 1; }
          cp "$EXE" "$OUT/storage-agent-workbench-$VERSION-windows-x64-setup.exe"
          ( cd "$OUT" && sha256sum storage-agent-workbench-* > SHA256SUMS-windows-x64.txt && cat SHA256SUMS-windows-x64.txt )
          gh release upload "$VERSION" "$OUT"/* --clobber

  finalize:
    name: Publish release
    needs: [prepare, release-macos-arm64, release-linux-x64, release-windows-x64]
    if: ${{ needs.prepare.outputs.draft != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish only after every platform upload succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Published release $VERSION (all platform assets present)."
