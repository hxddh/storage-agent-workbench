name: Release

# Tag a commit (`git tag v23.0.0 && git push origin v23.0.0`) or run this
# workflow manually. Builds installers on macOS, Linux and Windows and attaches
# them, with the update feeds (latest*.yml), to one GitHub release.
#
# Signing is preferred: CSC_LINK / CSC_KEY_PASSWORD (macOS Developer ID, .p12),
# APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (notarization) and
# WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD (Windows). When they are absent, macOS is
# ad-hoc signed and Windows is unsigned; the release notes say so. A release
# still needs all three platform builds: if one fails, nothing is published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v23.0.0)"
        required: true

permissions:
  contents: write

jobs:
  eval:
    name: Real-model or smoke evaluation
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: mode
        env:
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
        run: |
          if [ -n "$EVAL_API_KEY" ]; then
            echo "mode=real" >> "$GITHUB_OUTPUT"
          else
            echo "mode=smoke" >> "$GITHUB_OUTPUT"
          fi
      - name: Evaluate primary model
        if: steps.mode.outputs.mode == 'real'
        run: xvfb-run -a node scripts/eval.mjs --runs 2
        env:
          EVAL_PROVIDER: ${{ vars.EVAL_PROVIDER || 'anthropic' }}
          EVAL_MODEL: ${{ vars.EVAL_MODEL_PRIMARY }}
          EVAL_BASE_URL: ${{ vars.EVAL_BASE_URL }}
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
      - name: Keep primary report
        if: steps.mode.outputs.mode == 'real'
        run: cp .amp/in/artifacts/eval-report.md eval-primary.md
      - name: Evaluate secondary model
        if: steps.mode.outputs.mode == 'real'
        run: xvfb-run -a node scripts/eval.mjs --runs 2
        env:
          EVAL_PROVIDER: ${{ vars.EVAL_PROVIDER || 'anthropic' }}
          EVAL_MODEL: ${{ vars.EVAL_MODEL_SECONDARY }}
          EVAL_BASE_URL: ${{ vars.EVAL_BASE_URL }}
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
      - name: Smoke the harness when no model credentials exist
        if: steps.mode.outputs.mode != 'real'
        run: xvfb-run -a node scripts/eval.mjs --smoke
      - name: Keep smoke report
        if: steps.mode.outputs.mode != 'real'
        run: cp .amp/in/artifacts/eval-report.md eval-primary.md
      - uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: |
            eval-primary.md
            .amp/in/artifacts/eval-report.md

  signing:
    name: Detect signing credentials
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.detect.outputs.signed }}
    steps:
      - id: detect
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          signed=true
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            [ -n "${!name}" ] || signed=false
          done
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }}
    needs: [eval, signing]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run sbom
      - name: Package
        shell: bash
        # An empty secret arrives as an empty string, which electron-builder
        # reads as a certificate path; unset what is not configured.
        run: |
          if [ "$SIGNED" != "true" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          for name in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || unset "$name"
          done
          npx electron-builder --publish never
        env:
          SIGNED: ${{ needs.signing.outputs.signed }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ needs.signing.outputs.signed == 'true' && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            sbom.json
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/latest*.yml
            release/*.blockmap

  publish:
    name: Publish
    needs: [build, eval, signing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: eval-reports
          path: eval-reports
      - name: Build release notes from the eval reports
        env:
          EVAL_MODE: ${{ needs.eval.outputs.mode }}
          SIGNED: ${{ needs.signing.outputs.signed }}
        run: |
          {
            if [ "$EVAL_MODE" = "real" ]; then
              echo "## Real-model evaluation"
            else
              echo "## Evaluation: harness smoke only"
              echo "No model credentials were available; this report proves the harness runs, not answer quality."
            fi
            cat eval-reports/eval-primary.md
            echo
            if [ "$EVAL_MODE" = "real" ]; then cat eval-reports/eval-report.md; fi
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "Installers are signed and notarized."
            else
              echo "These installers are unsigned. macOS builds are ad-hoc signed only; expect Gatekeeper and SmartScreen warnings."
            fi
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          # A dispatched run creates the tag; put it on the commit that was built.
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: release-notes.md
          # download-artifact keeps each bundle's release/ directory; do not
          # flatten it into the top level or the installers are skipped.
          files: |
            artifacts/sbom.json
            artifacts/release/*
