name: v0.93 Task primitive migration

on:
  push:
    branches:
      - chatgpt/v0.93-agent-native-rebuild

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v0.93-agent-native-rebuild
          fetch-depth: 0

      - name: Replace thread-era task primitives
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("frontend")
          replacements = [
              ('../hooks/useThreadViewport', '../hooks/useTaskViewport'),
              ('./hooks/useThreadViewport', './hooks/useTaskViewport'),
              ('useThreadViewport', 'useTaskViewport'),
              ('../threadFind', '../taskFind'),
              ('./threadFind', './taskFind'),
              ('threadNavigation', 'taskNavigation'),
              ('TurnDirection', 'TaskStepDirection'),
              ('currentTurnIndex', 'currentTaskStepIndex'),
              ('stepTurnIndex', 'stepTaskIndex'),
              ('nextTurnIndex', 'nextTaskStepIndex'),
              ('findInThread', 'findInTask'),
              ('FindableItem', 'TaskFindableItem'),
              ('./ThreadCardsImplementation', './TaskContentImplementation'),
              ('./ThreadCards', './TaskContent'),
              ('ThreadCardsImplementation', 'TaskContentImplementation'),
          ]
          paths = list((root / "src").rglob("*.ts")) + list((root / "src").rglob("*.tsx")) + list((root / "e2e").rglob("*.ts"))
          for path in paths:
              text = path.read_text()
              changed = text
              for old, new in replacements:
                  changed = changed.replace(old, new)
              if changed != text:
                  path.write_text(changed)

          moves = [
              (root / "src/threadFind.ts", root / "src/taskFind.ts"),
              (root / "src/threadFind.test.ts", root / "src/taskFind.test.ts"),
              (root / "src/lib/threadNavigation.test.ts", root / "src/lib/taskNavigation.test.ts"),
          ]
          for old, new in moves:
              assert old.exists(), f"missing source {old}"
              assert not new.exists(), f"destination already exists {new}"
              old.rename(new)

          task_find = root / "src/taskFind.ts"
          text = task_find.read_text()
          text = text.replace("find inside one investigation", "find inside one Agent task")
          text = text.replace("thread item", "task item").replace("thread items", "task items")
          text = text.replace("across the thread", "across the task")
          text = text.replace("A thread of several hundred messages", "A task with several hundred durable events")
          text = text.replace("the thread renders", "the task renders")
          task_find.write_text(text)

          for legacy, replacement in [
              (root / "src/lib/threadNavigation.ts", root / "src/lib/taskNavigation.ts"),
              (root / "src/hooks/useThreadViewport.ts", root / "src/hooks/useTaskViewport.ts"),
              (root / "src/components/ThreadCards.tsx", root / "src/components/TaskContent.tsx"),
              (root / "src/components/ThreadCardsImplementation.tsx", root / "src/components/TaskContentImplementation.tsx"),
          ]:
              assert legacy.exists(), f"missing legacy source {legacy}"
              assert replacement.exists(), f"missing Agent-native replacement {replacement}"
              legacy.unlink()

          checks = "\n".join(path.read_text() for path in (root / "src").rglob("*.ts*"))
          forbidden_words = ["useThreadViewport", "threadFind", "threadNavigation", "TurnDirection", "stepTurnIndex", "nextTurnIndex", "findInThread", "FindableItem", "ThreadCardsImplementation"]
          for forbidden in forbidden_words:
              assert re.search(rf"\b{re.escape(forbidden)}\b", checks) is None, f"legacy primitive remains: {forbidden}"
          assert "useTaskViewport" in checks
          assert "taskFind" in checks
          assert "taskNavigation" in checks
          assert "TaskContentImplementation" in checks

      - name: Commit task-native primitives
        run: |
          git add -A frontend
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "refactor(agent): remove thread-era task primitives [v093-task-primitives]"
          git push origin HEAD:chatgpt/v0.93-agent-native-rebuild
