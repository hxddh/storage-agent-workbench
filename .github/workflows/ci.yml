name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No gate requires cloud/model credentials, signing secrets or a GUI session.
jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E smoke (real sidecar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sidecar
        run: pip install -c sidecar/requirements.lock -e "./sidecar[dev]"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E smoke
        working-directory: frontend
        run: npm run test:e2e
      - name: Capture Agent visual review
        working-directory: frontend
        run: npm run shots
      - name: Upload Agent visual review
        uses: actions/upload-artifact@v4
        with:
          name: agent-visual-review
          path: frontend/shots/
          retention-days: 14
          if-no-files-found: error
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  sidecar:
    name: Sidecar import & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (with dev extras)
        run: pip install -c requirements.lock -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Import check
        run: python -c "import app.main; print(app.main.SERVICE_NAME)"
      - name: Run tests
        run: pytest -q

  package-sidecar:
    name: Package sidecar (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (dev + packaging extras)
        run: pip install -c requirements.lock -e ".[dev]" -e ".[packaging]"
      - name: Build packaged sidecar (PyInstaller)
        run: python packaging/build_sidecar.py
      - name: Smoke test packaged sidecar (no AWS / no OPENAI_API_KEY)
        run: python packaging/smoke_test_sidecar.py

  desktop-build-macos:
    name: Desktop build (macOS / Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install sidecar deps (dev + packaging)
        run: pip install -c sidecar/requirements.lock -e "./sidecar[dev]" -e "./sidecar[packaging]"
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      - name: Build sidecar one-dir + stage resource
        run: python3 scripts/build-sidecar-for-tauri.py
      - name: cargo check
        run: cd src-tauri && cargo check
      - name: cargo build (compile + link desktop binary)
        run: cd src-tauri && cargo build
      - name: cargo tauri build (unsigned .app)
        run: cd src-tauri && cargo tauri build --bundles app
      - name: Package .app artifact
        run: |
          cd src-tauri/target/release/bundle/macos
          zip -ry storage-agent-workbench-macos-app.zip ./*.app
      - name: Upload macOS bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: storage-agent-workbench-macos-arm64
          path: |
            src-tauri/target/release/bundle/macos/*.zip
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
      - name: Runtime verification (structure + sidecar /health + best-effort launch)
        run: bash scripts/verify-runtime-macos.sh
      - name: Note on signing / GUI
        run: |
          echo "Built an UNSIGNED macOS .app (+ DMG if the bundler produced one)."
          echo "No code signing / notarization (no Apple developer account)."
          echo "GUI launch is not exercised on the headless runner; see docs/release.md."

  desktop-build-linux-x64:
    name: Desktop build (Linux x64) [experimental]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev build-essential curl wget file libssl-dev \
            xvfb
      - name: Install sidecar deps (dev + packaging)
        run: pip install -c sidecar/requirements.lock -e "./sidecar[dev]" -e "./sidecar[packaging]"
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      - name: Build sidecar one-dir + stage resource
        run: python3 scripts/build-sidecar-for-tauri.py
      - name: Smoke test packaged sidecar (no AWS / no OPENAI_API_KEY)
        run: cd sidecar && python packaging/smoke_test_sidecar.py
      - name: cargo check
        run: cd src-tauri && cargo check
      - name: cargo build
        run: cd src-tauri && cargo build
      - name: cargo tauri build (.deb; unsigned)
        run: cd src-tauri && cargo tauri build --bundles deb
      - name: Verify artifacts
        run: python3 scripts/verify-desktop-artifacts.py
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: storage-agent-workbench-linux-x64
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
      - name: Runtime verification (structure + sidecar /health; launch skipped headless)
        run: bash scripts/verify-runtime-linux.sh --skip-launch

  desktop-build-windows-x64:
    name: Desktop build (Windows x64) [experimental]
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install sidecar deps (dev + packaging)
        run: pip install -c sidecar/requirements.lock -e "./sidecar[dev]" -e "./sidecar[packaging]"
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2"
      - name: Build frontend
        run: cd frontend; npm ci; npm run build
      - name: Build sidecar one-dir + stage resource
        run: python scripts/build-sidecar-for-tauri.py
      - name: Smoke test packaged sidecar (no AWS / no OPENAI_API_KEY)
        run: cd sidecar; python packaging/smoke_test_sidecar.py
      - name: cargo check
        run: cd src-tauri; cargo check
      - name: cargo build
        run: cd src-tauri; cargo build
      - name: cargo tauri build (NSIS installer; unsigned)
        run: cd src-tauri; cargo tauri build --bundles nsis
      - name: Verify artifacts
        run: python scripts/verify-desktop-artifacts.py
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: storage-agent-workbench-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
      - name: Runtime verification (structure + sidecar /health + launch)
        run: powershell -ExecutionPolicy Bypass -File scripts/verify-runtime-windows.ps1
