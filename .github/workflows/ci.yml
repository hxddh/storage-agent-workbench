name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run budget
      - run: npm run audit
      - run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  e2e:
    name: End-to-end (real window, fake S3 and model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: xvfb-run -a node scripts/e2e.mjs
      - run: xvfb-run -a node scripts/eval.mjs --smoke
      - run: xvfb-run -a node scripts/perf.mjs
      - run: xvfb-run -a node scripts/shots.mjs
      - run: node scripts/visual.mjs

  compat:
    name: AWS compatibility (moto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "moto[server]==5.2.4"
      - run: npm ci
      - name: Start moto
        run: |
          moto_server -p 5055 > moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5055/ >/dev/null && break; sleep 1; done
      - run: npx vitest run src/main/compat.test.ts
        env:
          STORAGE_AGENT_AWS_ENDPOINT: http://127.0.0.1:5055
