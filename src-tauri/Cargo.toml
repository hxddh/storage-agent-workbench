[package]
name = "storage-agent-workbench"
version = "0.23.0"
description = "Local-first agent for object storage operations, analytics, and management on S3-compatible systems"
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"

[lib]
name = "storage_agent_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS CSPRNG for the per-launch sidecar auth token. Already present transitively
# (Tauri depends on it); pinned to the 0.2 line that is in Cargo.lock. Do NOT
# hand-roll the token from clock/pid/ports — those are locally observable and
# low-entropy (see gen_token in src/lib.rs).
getrandom = "0.2"
# Single-instance guard. Two launches would otherwise run two sidecars over the
# SAME app data dir: the secret vault rewrites the whole file on every save, so
# the second instance's write silently discarded whatever the first had stored
# (and SQLite/DuckDB contend on one app.db). The plugin hands the argv to the
# already-running instance instead, which focuses its window.
tauri-plugin-single-instance = "2"

# NOTE: The Python FastAPI sidecar is packaged with PyInstaller as a ONE-DIR
# bundle, shipped as a Tauri resource, and launched directly from src/lib.rs via
# std::process. See docs/packaging.md. This Rust code is unverified in CI when
# the Rust toolchain is absent (a documented packaging blocker).
