[package]
name = "storage-agent-workbench"
version = "1.16.1"
description = "Local-first agent for object storage operations, analytics, and management on S3-compatible systems"
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"

[lib]
name = "storage_agent_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS CSPRNG for the per-launch sidecar auth token. Tracks the current release
# line rather than a hand-picked one: the old `0.2` pin was justified as "the
# line Tauri already pulls", and that stopped being true — Tauri moved to 0.3.x,
# so pinning 0.2 was adding a SECOND copy to the tree instead of avoiding one.
# Do NOT hand-roll the token from clock/pid/ports — those are locally observable
# and low-entropy (see gen_token in src/lib.rs).
getrandom = "0.4"
# Single-instance guard. Two launches would otherwise run two sidecars over the
# SAME app data dir: the secret vault rewrites the whole file on every save, so
# the second instance's write silently discarded whatever the first had stored
# (and SQLite/DuckDB contend on one app.db). The plugin hands the argv to the
# already-running instance instead, which focuses its window.
tauri-plugin-single-instance = "2"
# Modern native-agent OS integrations (all Tauri v2, all local-only):
# - dialog: reliable file pick / save (replaces ad-hoc anchor download)
# - notification: task-completion / needs-decision toasts when window is backgrounded
# - global-shortcut: ⌘⇧S / Ctrl+Shift+S to summon the Agent
# - updater: signed auto-update (requires signing; inert until pubkey+endpoints set)
# - deep-link: storage-agent://task/<id> to open a Task from an external link
# - opener: system browser / mail client for https:/mailto: links (replaces hand-rolled open)
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
# - window-state: remember the window's size / position / maximised state
#   across launches (restored by the Rust side alone; no JS counterpart)
tauri-plugin-window-state = "2"

# NOTE: The Python FastAPI sidecar is packaged with PyInstaller as a ONE-DIR
# bundle, shipped as a Tauri resource, and launched directly from src/lib.rs via
# std::process. See docs/packaging.md. This Rust code is unverified in CI when
# the Rust toolchain is absent (a documented packaging blocker).
