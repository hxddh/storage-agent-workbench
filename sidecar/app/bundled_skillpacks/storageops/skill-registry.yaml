# StorageOps Skill Registry (v10: five short method cards)
#
# The agent sees each card's name (without the storageops- prefix) and the
# first sentence of its description as a CATALOG, and loads the card on demand
# with the read-only read_skill tool. `description` is the only routing signal.

version: "2.0"

skills:
  - name: storageops-account-posture
    path: skills/storageops-account-posture/SKILL.md
    description: >
      Account-wide overview or audit with no specific error, and observability
      (logging, notifications, inventory).
    domains: [account, posture, observability]

  - name: storageops-security-iam
    path: skills/storageops-security-iam/SKILL.md
    description: >
      403/AccessDenied with valid credentials, or "is anything public?" — walk
      the authorization chain.
    domains: [security]

  - name: storageops-protocol-compat
    path: skills/storageops-protocol-compat/SKILL.md
    description: >
      SignatureDoesNotMatch, region/301, addressing, presigned URLs, TLS/DNS/timeouts,
      CLI/SDK quirks, stale reads, NotImplemented on S3-compatible providers.
    domains: [protocol, network, compatibility]

  - name: storageops-access-logs
    path: skills/storageops-access-logs/SKILL.md
    description: >
      Access logs or inventories — who is accessing, error spikes, throttling
      (429/503), hot prefixes, capacity and object shape.
    domains: [access-log, inventory, performance]

  - name: storageops-lifecycle-cost
    path: skills/storageops-lifecycle-cost/SKILL.md
    description: >
      Storage cost and tiering, lifecycle rules, noncurrent versions, stuck
      multipart uploads, replication and object lock.
    domains: [lifecycle, cost, replication]
